<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARDI Photo & Videography – Pricelist 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5e9;--card:#fffdf8;--ink:#4a3a24;--gold:#b08a4a;--gold2:#c9a465;--soft:#f3e8d2;--line:#e6d6b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#272016;--ink:#f1e5cc;--soft:#352b1c;--line:#4a3c26}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#272016;--ink:#f1e5cc;--soft:#352b1c;--line:#4a3c26}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
header{text-align:center;padding:48px 20px 24px}
header h1{font-size:clamp(44px,9vw,76px);margin:0;letter-spacing:.08em;font-weight:600}
header p{margin:6px 0 0;color:var(--gold);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
header h2{font-size:clamp(28px,5vw,40px);margin:22px 0 4px;font-weight:600}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);border:1px solid var(--gold2);border-radius:99px;padding:6px 14px;font-size:14px}
nav a:hover{background:var(--gold);color:#fff}
main{max-width:1060px;margin:0 auto;padding:0 16px 40px}
section{padding-top:36px}
section h3{font-size:clamp(30px,5vw,44px);margin:0;font-weight:700}
section h3 em{display:block;font-size:.55em;color:var(--gold);font-weight:500}
.desc{margin:4px 0 16px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .h{background:var(--gold);color:#fff;text-align:center;padding:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.card ul{list-style:none;margin:0;padding:14px 18px;flex:1}
.card li{padding:3px 0 3px 22px;position:relative;font-size:15px}
.card li:before{content:"✓";position:absolute;left:0;color:var(--gold)}
.price{background:var(--soft);text-align:center;font-weight:600;font-size:20px;padding:10px;letter-spacing:.03em}
.btn{display:block;width:100%;border:0;background:#25a244;color:#fff;font:600 15px Jost,sans-serif;padding:12px;cursor:pointer;text-align:center;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.card .btn{background:var(--ink);color:var(--bg)}
#booking{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:40px}
#booking h3{margin-bottom:12px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-size:13px;display:block;margin-bottom:3px;color:var(--gold)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px Jost,sans-serif}
textarea{min-height:70px}
.full{grid-column:1/-1}
#sum{font-weight:600;margin:12px 0}
footer{text-align:center;padding:24px;font-size:13px;opacity:.8}
.link{background:none;border:0;color:var(--gold);cursor:pointer;font:inherit;text-decoration:underline}
.edit-bar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;display:none;gap:8px;flex-wrap:wrap;z-index:9;max-width:94%;justify-content:center;font-size:13px}
.edit-bar button{border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font:600 13px Jost,sans-serif;background:var(--gold);color:#fff}
body.edit .edit-bar{display:flex}
.card textarea,.card input{margin:6px 0}
.card .ed{padding:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font:600 15px Jost,sans-serif;padding:12px 16px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.fab:hover{filter:brightness(1.08)}
.fab svg{width:24px;height:24px;fill:#fff}
@media (max-width:480px){.fab span{display:none}.fab{padding:14px}}
body.edit .fab{display:none}
.wa-edit{display:none;max-width:420px;margin:16px auto 0}
body.edit .wa-edit{display:block}
</style>
</head>
<body>
<header>
  <h1 class="serif" id="brand"></h1>
  <p id="tag"></p>
  <h2 class="serif">Pricelist 2026</h2>
  <div class="desc" id="slogan"></div>
  <div class="wa-edit">
    <label>Nomor WhatsApp (format 62…, tanpa + / spasi)</label><input id="waIn">
    <label>Nama brand</label><input id="brandIn">
    <label>Slogan</label><input id="sloganIn">
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="cats"></div>
  <div id="booking">
    <h3 class="serif">Booking via WhatsApp</h3>
    <div class="f">
      <div><label>Nama</label><input id="nm" placeholder="Nama lengkap"></div>
      <div><label>No. WhatsApp Anda</label><input id="hp" placeholder="08xxxxxxxxxx" inputmode="tel"></div>
      <div><label>Kategori</label><select id="cs"></select></div>
      <div><label>Paket</label><select id="ps"></select></div>
      <div><label>Tanggal acara</label><input id="dt" type="date"></div>
      <div><label>Lokasi acara</label><input id="lc" placeholder="Kota / tempat"></div>
      <div class="full"><label>Catatan</label><textarea id="nt" placeholder="Jam acara, permintaan khusus, dll."></textarea></div>
    </div>
    <div id="sum"></div>
    <a class="btn" id="go" target="_blank" rel="noopener" style="border-radius:12px">Kirim Booking ke WhatsApp</a>
  </div>
</main>
<footer><span id="ft"></span> · <button class="link" id="adm">Admin</button></footer>

<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Chat WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-2.9-.4-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-1.600-.8-2.600-1.400-3.600-3.100-.3-.5.3-.5.8-1.500.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.300-.7.700-1 1.500-1 2.400.1 1 .5 2 1.100 2.800 1.300 1.800 2.900 3.200 5 4 1.800.7 2.500.6 3 .5.600-.1 1.500-.6 1.700-1.200.2-.6.2-1.100.1-1.200-.1-.1-.3-.2-.5-.3z"/></svg><span>Chat WhatsApp</span></a>
<div class="edit-bar">
  <span>Mode Edit aktif — perubahan tersimpan di browser ini.</span>
  <button id="copy">Salin Data</button><button id="reset">Reset</button><button id="done">Selesai</button>
</div>

<script>
/* ====== DATA DEFAULT — bisa diedit langsung di sini ====== */
const DEFAULT={
 wa:"6289506801472", brand:"ARDI", tagline:"Photo & Videography",
 slogan:"Abadikan setiap cerita dalam karya yang bermakna",
 cats:[
 {id:"lamaran",title:"Lamaran",desc:"Dokumentasi momen lamaran yang penuh haru dan kebahagiaan, dikemas secara elegan dan profesional.",pk:[
  {n:"Paket 1",p:2500000,i:["Foto (Semua File)","50 Foto Edit","Video Highlight (2–3 Menit)","1 Fotografer","1 Videografer"]},
  {n:"Paket 2",p:3500000,i:["Foto (Semua File)","75 Foto Edit","Video Highlight (3–5 Menit)","2 Fotografer","1 Videografer"]},
  {n:"Paket 3",p:5000000,i:["Foto (Semua File)","100 Foto Edit","Video Highlight (3–5 Menit)","2 Fotografer","2 Videografer"]}]},
 {id:"prewedding",title:"Prewedding",desc:"Abadikan kisah cinta sebelum hari bahagia dengan hasil yang sinematik dan penuh makna.",pk:[
  {n:"Paket 1",p:2500000,i:["Foto (Semua File)","20 Foto Edit","Video Cinematic (1–2 Menit)","1 Lokasi"]},
  {n:"Paket 2",p:3500000,i:["Foto (Semua File)","30 Foto Edit","Video Cinematic (2–3 Menit)","2 Lokasi"]},
  {n:"Paket 3",p:5000000,i:["Foto (Semua File)","100 Foto Edit","Video Cinematic (5–7 Menit)","2–3 Lokasi"]}]},
 {id:"wedding",title:"Wedding",desc:"Abadikan hari paling bersejarah dalam hidup Anda dengan dokumentasi yang elegan, sinematik, dan penuh makna.",pk:[
  {n:"Paket 1",p:6000000,i:["Foto (Semua File)","100 Foto Edit","Video Highlight (3–5 Menit)","Liputan Akad atau Resepsi","1 Fotografer","1 Videografer"]},
  {n:"Paket 2",p:8500000,i:["Foto (Semua File)","200 Foto Edit","Video Cinematic (5–7 Menit)","Liputan Akad + Resepsi","2 Fotografer","1 Videografer"]},
  {n:"Paket 3",p:12000000,i:["Foto (Semua File)","300 Foto Edit","Video Cinematic (7–10 Menit)","Liputan Akad + Resepsi","2 Fotografer","2 Videografer"]}]},
 {id:"ulangtahun",title:"Ulang Tahun",desc:"Abadikan keceriaan dan kebahagiaan di hari spesial dengan dokumentasi yang hidup dan berkesan.",pk:[
  {n:"Paket 1",p:2000000,i:["Foto (Semua File)","50 Foto Edit","Video Highlight (2–3 Menit)","1 Fotografer","1 Videografer"]},
  {n:"Paket 2",p:3000000,i:["Foto (Semua File)","50 Foto Edit","Video Highlight (3–5 Menit)","1 Fotografer","1 Videografer"]},
  {n:"Paket 3",p:4000000,i:["Foto (Semua File)","100 Foto Edit","Video Highlight (5–7 Menit)","2 Fotografer","2 Videografer"]}]},
 {id:"wisuda",title:"Wisuda",desc:"Abadikan momen penuh perjuangan dan kebanggaan dengan hasil yang profesional dan berkesan.",pk:[
  {n:"Paket 1",p:2000000,i:["Foto (Semua File)","50 Foto Edit","Video Highlight (2–3 Menit)","1 Fotografer","1 Videografer"]},
  {n:"Paket 2",p:3000000,i:["Foto (Semua File)","50 Foto Edit","Video Highlight (2–5 Menit)","2 Fotografer","1 Videografer"]},
  {n:"Paket 3",p:4000000,i:["Foto (Semua File)","100 Foto Edit","Video Highlight (5–7 Menit)","2 Fotografer","2 Videografer"]}]},
 {id:"aqiqah",title:"Aqiqah",desc:"Dokumentasi momen aqiqah yang penuh makna dengan sentuhan hangat dan natural.",pk:[
  {n:"Paket 1",p:2000000,i:["Foto (Semua File)","50 Foto Edit","Video Highlight (2–3 Menit)","1 Fotografer","1 Videografer"]},
  {n:"Paket 2",p:3000000,i:["Foto (Semua File)","50 Foto Edit","Video Highlight (3–5 Menit)","2 Fotografer","1 Videografer"]},
  {n:"Paket 3",p:4000000,i:["Foto (Semua File)","100 Foto Edit","Video Highlight (5–7 Menit)","2 Fotografer","2 Videografer"]}]}
 ]};
/* ========================================================= */
const KEY="ardi_pricelist_v4";
let D;
try{D=JSON.parse(localStorage.getItem(KEY))||null}catch(e){D=null}
if(!D)D=JSON.parse(JSON.stringify(DEFAULT));
const $=id=>document.getElementById(id);
const rp=n=>"IDR "+Number(n||0).toLocaleString("id-ID");
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const editing=()=>document.body.classList.contains("edit");

function render(){
  $("brand").textContent=D.brand;$("tag").textContent=D.tagline;$("slogan").textContent=D.slogan;
  $("ft").textContent="© 2026 "+D.brand+" "+D.tagline;
  $("waIn").value=D.wa;$("brandIn").value=D.brand;$("sloganIn").value=D.slogan;
  $("nav").innerHTML=D.cats.map(c=>`<a href="#${c.id}">${esc(c.title)}</a>`).join("")+`<a href="#booking">Booking</a>`;
  $("cats").innerHTML=D.cats.map((c,ci)=>`<section id="${c.id}">
    <h3 class="serif"><em>Paket</em>${esc(c.title)}</h3>
    ${editing()?`<textarea data-c="${ci}" data-f="desc">${esc(c.desc)}</textarea>`:`<p class="desc">${esc(c.desc)}</p>`}
    <div class="grid">${c.pk.map((k,ki)=>editing()?`
      <div class="card"><div class="ed">
        <input data-c="${ci}" data-k="${ki}" data-f="n" value="${esc(k.n)}">
        <textarea data-c="${ci}" data-k="${ki}" data-f="i" rows="6">${esc(k.i.join("\n"))}</textarea>
        <input data-c="${ci}" data-k="${ki}" data-f="p" value="${k.p}" inputmode="numeric" placeholder="Harga (angka)">
      </div></div>`:`
      <div class="card"><div class="h">${esc(k.n)}</div>
        <ul>${k.i.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <div class="price">${rp(k.p)}</div>
        <button class="btn" onclick="pick(${ci},${ki})">Pesan Paket Ini</button></div>`).join("")}
    </div></section>`).join("");
  $("cs").innerHTML=D.cats.map((c,i)=>`<option value="${i}">${esc(c.title)}</option>`).join("");
  fillPk();
}
function fillPk(sel){
  const c=D.cats[$("cs").value||0];
  $("ps").innerHTML=c.pk.map((k,i)=>`<option value="${i}">${esc(k.n)} – ${rp(k.p)}</option>`).join("");
  if(sel!=null)$("ps").value=sel;
  upd();
}
function pick(ci,ki){$("cs").value=ci;fillPk(ki);$("booking").scrollIntoView({behavior:"smooth"})}
function msg(){
  const c=D.cats[$("cs").value],k=c.pk[$("ps").value];
  const L=["Halo "+D.brand+" "+D.tagline+", saya ingin booking:","",
   "Nama: "+($("nm").value||"-"),"No. WA: "+($("hp").value||"-"),
   "Kategori: "+c.title,"Paket: "+k.n+" ("+rp(k.p)+")",
   "Isi paket: "+k.i.join(", "),
   "Tanggal acara: "+($("dt").value||"-"),"Lokasi: "+($("lc").value||"-")];
  if($("nt").value)L.push("Catatan: "+$("nt").value);
  L.push("","Mohon info ketersediaan jadwalnya. Terima kasih!");
  return L.join("\n");
}
function upd(){
  $("fab").href="https://wa.me/"+D.wa.replace(/\D/g,"")+"?text="+encodeURIComponent("Halo "+D.brand+", saya ingin bertanya tentang paket foto & video.");
  const c=D.cats[$("cs").value],k=c&&c.pk[$("ps").value];if(!k)return;
  $("sum").textContent="Pilihan: "+c.title+" · "+k.n+" · "+rp(k.p);
  $("go").href="https://wa.me/"+D.wa.replace(/\D/g,"")+"?text="+encodeURIComponent(msg());
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(["nm","hp","dt","lc","nt","ps"].includes(t.id))return upd();
  if(t.id==="cs")return fillPk();
  if(t.id==="waIn"){D.wa=t.value;upd()}else if(t.id==="brandIn"){D.brand=t.value}else if(t.id==="sloganIn"){D.slogan=t.value}
  else if(t.dataset.f){
    const c=D.cats[t.dataset.c];
    if(t.dataset.k==null)c[t.dataset.f]=t.value;
    else{const k=c.pk[t.dataset.k],f=t.dataset.f;
      if(f==="i")k.i=t.value.split("\n").map(s=>s.trim()).filter(Boolean);
      else if(f==="p")k.p=Number(t.value.replace(/\D/g,""))||0;
      else k.n=t.value;}
  } else return;
  save();
});
$("adm").onclick=()=>{document.body.classList.add("edit");render();scrollTo({top:0,behavior:"smooth"})};
$("done").onclick=()=>{document.body.classList.remove("edit");render()};
$("reset").onclick=()=>{if(confirm("Kembalikan semua data ke awal?")){D=JSON.parse(JSON.stringify(DEFAULT));save();render()}};
$("copy").onclick=()=>{const s=JSON.stringify(D,null,1);
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert("Data disalin."),()=>{prompt("Salin data ini:",s)})};
render();
</script>
</body>
</html>
